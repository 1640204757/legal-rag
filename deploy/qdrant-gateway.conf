events {}
http {
    # 只转发到用户现有Qdrant；宿主发布地址另限定为127.0.0.1。
    access_log off;
    client_max_body_size 32m;
    server {
        listen 8080;
        location / {
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $database qdrant;
            proxy_pass http://$database:6333;
            proxy_read_timeout 120s;
        }
    }
}
